name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: make dmg

      - name: Verify DMG
        run: hdiutil verify .build/Mote-arm64.dmg

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ steps.v.outputs.version }}" > generated_notes.json
          jq -r '.body' generated_notes.json > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            .build/Mote-arm64.dmg \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file release_notes.md \
            --latest
